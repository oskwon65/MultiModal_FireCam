; =====================================================================
; otg_monitoring.ini - startup configuration
;
; Place this file in the SAME folder as otg_monitoring.exe.
; It is read before anything else, because ROOT_PATH decides where
; users\<ID>\env.ini itself is located.
;
; If this file is missing (or ROOT_PATH is empty) the program falls back
; to the folder the exe itself sits in.
; =====================================================================

[PATHS]
; Start folder (project root). Absolute path.
; Both '\' and '/' separators are accepted; a trailing separator is optional.
ROOT_PATH=D:\MultiModal_FireCam\

[PYTHON]
; Defaults for the Anaconda environment used to launch the python processes.
; These win over users\<ID>\env.ini (Anaconda location is per-PC, not per-site).
ANACONDA_ROOT=C:\Users\oskwo\anaconda3\
ANACONDA_ENV=mmc
