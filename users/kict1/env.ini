[NETWORK]
ROOT_URL= http://sangchoo.com/kict_samsung
MONITOR_SEAT_ORDER = 1 
SLAVE_NUM = 1

[PATHS]
ROOT_PATH = D:/MultiModal_FireCam/
TEST_IMG = samples/test-0.jpg
FIRE_MODEL = fire_detection/best_epoch_31_fire_smoke_person.pt

[CONSTANTS]
#time unit : seconds
NUM_OF_MACHINE_CELLS = 16
SZ_OF_LATENT_DIM_AUTOENCODER = 16
X_GRID = 8
Y_GRID = 8
FLIR_WIDTH = 160
FLIR_HEIGHT = 120
MAXNUM_THERMAL_FIFO = 30 
WAITING_TIME_PEOPLE_DETECTION = 5 
WAITING_TIME_GET_SVR_HOTLIST = 5 

#detection of fallen person : angle
THRESH_0_FALL_DOWN = 45
THRESH_0_PERSON = 0.3
THR_CONF_FIRE = 0.3
THR_TEMPT_FIRE = 25
THR_TEMPT_SMOKE = 5
THR_CONF_SMOKE = 0.3

; --- 절대 임계값 (연속 학습 0단계) ---------------------------
; 학습과 무관하게 항상 동작하는 안전망. 아래 온도는 이 현장의 실제
; 데이터에서 마스크 셀이 정상 가동 중 올라간 최고 온도를 기준으로
; 잡았다. 설비를 바꾸거나 카메라를 옮기면 다시 확인해야 한다.
ABS_TEMP_WARN = 207
ABS_TEMP_ALARM = 222
; 분당 상승률. 이 현장 정상 가동 중 실측 최대치에 여유를 둔 값이다.
; 설비가 빠르게 달아오르는 것이 정상인 현장도 있어 현장마다 다르다.
ABS_RISE_WARN = 20
ABS_RISE_ALARM = 34

[DB_ADMIN]
DB_ADMIN_HOST = localhost
DB_ADMIN_PORT = 3306
DB_ADMIN_USER = root
; DB_ADMIN_PASSWORD 는 같은 폴더의 secrets.ini 에 있습니다 (git 제외 대상)

[DB_RUNTIME]
