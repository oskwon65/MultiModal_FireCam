[NETWORK]
ROOT_URL= http://sangchoo.com/kict_samsung
MONITOR_SEAT_ORDER = 0 
SLAVE_NUM = 0

[PATHS]
ROOT_PATH = D:/MultiModal_FireCam/
TEST_IMG = samples/otg_fire_frame_00039.jpg
FIRE_MODEL = fire_detection/best_epoch_31_fire_smoke_person.pt

[CONSTANTS]
#time unit : seconds
NUM_OF_MACHINE_CELLS = 16
SZ_OF_LATENT_DIM_AUTOENCODER = 16
X_GRID = 8
Y_GRID = 8
FLIR_WIDTH = 160
FLIR_HEIGHT = 120
MAXNUM_THERMAL_FIFO = 10 
WAITING_TIME_PEOPLE_DETECTION = 5
WAITING_TIME_GET_SVR_HOTLIST = 30 

#detection of fallen person : angle
THRESH_0_FALL_DOWN = 45
THRESH_0_PERSON = 0.3
THR_CONF_FIRE = 0.3
THR_TEMPT_FIRE = 25
THR_TEMPT_SMOKE = 5
THR_CONF_SMOKE = 0.3

; --- 절대 임계값 (연속 학습 0단계) ---------------------------
; 학습과 무관하게 항상 동작하는 안전망. 아래 온도는 이 현장의 실제
; 데이터에서 마스크 셀이 정상 가동 중 올라간 최고 온도를 기준으로
; 잡았다. 설비를 바꾸거나 카메라를 옮기면 다시 확인해야 한다.
ABS_TEMP_WARN = 172
ABS_TEMP_ALARM = 187
; 분당 상승률. 이 현장 정상 가동 중 실측 최대치에 여유를 둔 값이다.
; 설비가 빠르게 달아오르는 것이 정상인 현장도 있어 현장마다 다르다.
ABS_RISE_WARN = 90
ABS_RISE_ALARM = 120

; --- 연속 학습 단계 전환 조건 ([설정] 창에서 바꾼다) ---------
BASELINE_MIN_SAMPLES = 3000
BASELINE_MIN_HOURS = 18
RETRAIN_MIN_SAMPLES = 5000
; 계산 기준일 (YYYY-MM-DD). 이 날짜 이전 데이터는 기준선 누적과
; 재학습 표집에서 제외한다. 비우면 전체 기간을 쓴다.
; 날짜를 바꾸면 셀별 기준선을 버리고 처음부터 다시 쌓는다.
CALC_BASE_DATE = 

[DB_ADMIN]
DB_ADMIN_HOST = localhost
DB_ADMIN_PORT = 3306
DB_ADMIN_USER = root
; DB_ADMIN_PASSWORD 는 같은 폴더의 secrets.ini 에 있습니다 (git 제외 대상)

[DB_RUNTIME]
DB_HOST = localhost
DB_PORT = 3306
DB_USER = otg_user
; DB_PASSWORD 는 같은 폴더의 secrets.ini 에 있습니다 (git 제외 대상)
DB_NAME_SENSOR = sensor_data
DB_NAME_HISTORY = results_history

[PYTHON]
ANACONDA_ENV = mfpcam
ANACONDA_ROOT = C:/Users/KICT-SC/anaconda3

[SHOW]
ENABLE_SMS_ALERTS = 1
SHOW_THERMAL_IMG= 0
