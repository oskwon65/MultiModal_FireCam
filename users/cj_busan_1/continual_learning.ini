; 연속학습 설정 (continual_learning.ini)
;
; 운영하며 만지는 값만 모았습니다. 설치할 때 한 번 정하는 값(카메라 해상도,
; DB 이름, 경로)은 옆의 env.ini 에 있습니다.
;
; 모니터링 프로그램의 [설정] 창이 이 파일을 읽고 씁니다. 손으로 고쳤다면
; predict_machine 을 다시 기동해야 반영됩니다.
;
; 같은 열쇠가 env.ini 에도 있으면 이 파일이 이깁니다.

[CONSTANTS]

; --- 절대 임계값 (0단계) -----------------------------------------------
; 학습과 무관하게 항상 동작하는 안전망. 아래 온도는 이 현장의 실제
; 데이터에서 마스크 셀이 정상 가동 중 올라간 최고 온도를 기준으로
; 잡았다. 설비를 바꾸거나 카메라를 옮기면 다시 확인해야 한다.
ABS_TEMP_WARN = 172
ABS_TEMP_ALARM = 187
; 분당 상승률. 이 현장 정상 가동 중 실측 최대치에 여유를 둔 값이다.
; 설비가 빠르게 달아오르는 것이 정상인 현장도 있어 현장마다 다르다.
ABS_RISE_WARN = 90
ABS_RISE_ALARM = 120

; --- 단계 전환 조건 ---------------------------------------------------
BASELINE_MIN_SAMPLES = 3000
BASELINE_MIN_HOURS = 18
RETRAIN_MIN_SAMPLES = 5000
; 2단계 최소 시간대. 재학습 표본이 하루 24시각 중 몇 개를 덮어야 하는가.
;
; 개수만으로는 "낮에만 아는 모델" 을 막지 못한다. kict1 은 표본 15,352건으로
; 최소 기준(5,000)의 세 배를 넘겼지만 새벽 02~07시가 통째로 비어 있었다.
; 그대로 학습하면 평범한 새벽 3시를 이상으로 판정한다.
RETRAIN_MIN_HOURS = 18
; 계산 기준일 (YYYY-MM-DD). 이 날짜 이전 데이터는 기준선 누적과
; 재학습 표집에서 제외한다. 비우면 전체 기간을 쓴다.
; 날짜를 바꾸면 셀별 기준선을 버리고 처음부터 다시 쌓는다.
CALC_BASE_DATE =

; --- 기여도 판단 -----------------------------------------------------
; 재학습이 기존 모델을 얼마나 물려받을지 가르는 점수 문턱.
;
; 칸 수가 아니라 지금 내고 있는 점수로 정한다. 실측에서 7월 자료를 3칸
; 밀어도 score 0.890 이었고, kict1 은 1.3칸 밀린 상태로 0.088 이었다.
; 칸 수는 모델 손상을 예측하지 못한다.
;
;   점수 >= HIGH  기여 1.00  평소대로 (옛 자료 포함, 웜스타트)
;   점수 <= LOW   기여 0.00  새로 시작 (감도 비교 대상으로는 계속 씀)
;   그 사이       두 끝점을 직선으로 이은 비율
;
; 근거가 확실한 것은 양 끝(정상 0.95, 망가진 0.09)뿐이라 가운데는 추정이다.
CONTRIB_BAND_HIGH = 0.85
CONTRIB_BAND_LOW = 0.20
; 기여도 판단 기준 ([설정] 창에서 바꾼다)
;
; "지금 이 모델이 몇 점을 내고 있는가" 를 재는 방법이다. 학습 표본을 뽑는
; 기준(RETRAIN_MIN_*)과는 다르다.
;
;   테이블 N개 -> 셋을 거름 -> 표본 M건 -> 지금 모델로 다시 매김
;   -> 중앙값 -> 기여 w
;
; 거르는 셋 : 직전과 값이 똑같은 프레임 · 절대 임계값을 넘은 프레임 ·
;             점수가 안 매겨진 프레임
;
; 판단 기간이 짧으면 설비 상태를 골고루 담지 못한다. cj_busan_1 에서 테이블
; 2개로 재 보니 가동 프레임이 0.3% 뿐이어서, 0.922 라는 점수가 사실은 "멈춘
; 설비를 잘 맞힌다" 는 뜻이었다. 7개로 늘리면 가동이 74.7% 가 된다.
; 반대로 너무 길면 멀쩡했던 지난 두 달이 최근의 고장을 덮는다.
;
; 표본 상한은 정확도가 아니라 메모리 때문에 둔다. 32,191건을 한 번에 다시
; 매기는 데 0.04초였고, 2,000건이면 중앙값 오차가 0.0014 다.
CONTRIB_WINDOW_TABLES = 7
CONTRIB_MIN_FRAMES = 500
CONTRIB_MAX_SAMPLES = 2000

; --- 학습 표본 ------------------------------------------------------
; 학습 표본 구성 ([설정] 창에서 바꾼다)
;
; 무엇을 배울지 정한다. 위 기여도 판단(지금 모델을 얼마나 믿을지)과는 다르다.
;
;   목표 표본 수    이만큼 모은다. 모자라면 복제하지 않고 있는 만큼만 쓴다.
;   정상 판정선     이 점수 위만 학습에 넣는다. 지금 모델로 다시 매긴 점수와
;                   그때 적힌 점수 중 하나만 넘으면 받는다.
;   가동 판정 온도  마스크 칸 최고가 이 위면 '돌고 있다' 로 본다. 비우면
;                   앞쪽 2,000건 최고온도의 중앙값으로 스스로 잡는다.
;   시기 나누어 담기  1 이면 칸이 (시각 x 가동상태) 에서 (시각 x 가동상태 x
;                   시기) 로 늘어난다. 시기는 자료가 7일 이상 끊긴 자리로
;                   저절로 나뉜다. 끊긴 적이 없으면 시기가 하나라 아무
;                   차이가 없다.
;
; 0 이면 자료가 많은 시기가 그만큼 많이 뽑힌다. 설비를 고치거나 카메라를
; 옮겨 한동안 멈췄다면, 멈추기 전 자료가 표본을 차지해 지금을 못 맞히는
; 쪽으로 끌어당길 수 있다.
RETRAIN_TARGET_SAMPLES = 60000
RETRAIN_NORMAL_MIN_SCORE = 0.5
RETRAIN_RUN_TEMP =
RETRAIN_ERA_BALANCE = 0
